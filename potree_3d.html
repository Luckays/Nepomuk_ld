<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Potree 3D</title>
  <link rel="stylesheet" type="text/css" href="./potree_scene/potree/build/potree/potree.css">
  <link rel="stylesheet" type="text/css" href="./potree_scene/potree/libs/jquery-ui/jquery-ui.min.css">
  <link rel="stylesheet" type="text/css" href="./potree_scene/potree/libs/openlayers3/ol.css">
  <link rel="stylesheet" type="text/css" href="./potree_scene/potree/libs/spectrum/spectrum.css">
  <link rel="stylesheet" type="text/css" href="./potree_scene/potree/libs/jstree/themes/mixed/style.css">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ede5d8;
    }

    .potree_container {
      position: absolute;
      inset: 0;
    }

    #potree_render_area {
      width: 100%;
      height: 100%;
      background-image: linear-gradient(180deg, #f6f0e6 0%, #ddd1c1 100%);
    }

    #errorBanner {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 1000;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(162, 70, 50, 0.92);
      color: white;
      font: 13px/1.4 "Segoe UI", sans-serif;
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>
  <script src="./potree_scene/potree/libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="./potree_scene/potree/libs/spectrum/spectrum.js"></script>
  <script src="./potree_scene/potree/libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="./potree_scene/potree/libs/other/BinaryHeap.js"></script>
  <script src="./potree_scene/potree/libs/tween/tween.min.js"></script>
  <script src="./potree_scene/potree/libs/d3/d3.js"></script>
  <script src="./potree_scene/potree/libs/proj4/proj4.js"></script>
  <script src="./potree_scene/potree/libs/openlayers3/ol.js"></script>
  <script src="./potree_scene/potree/libs/i18next/i18next.js"></script>
  <script src="./potree_scene/potree/libs/jstree/jstree.js"></script>
  <script src="./potree_scene/potree/build/potree/potree.js"></script>
  <script src="./potree_scene/potree/libs/plasio/js/laslaz.js"></script>

  <div class="potree_container">
    <div id="potree_render_area"></div>
    <div id="potree_sidebar_container"></div>
  </div>
  <div id="errorBanner"></div>

  <script type="module">
    import * as THREE from "./potree_scene/potree/libs/three.js/build/three.module.js";

    const viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
    window.viewer = viewer;

    viewer.setEDLEnabled(true);
    viewer.setFOV(60);
    viewer.setPointBudget(5_000_000);
    viewer.setMinNodeSize(10);
    viewer.setDescription("");
    viewer.setBackground("gradient");
    viewer.loadSettingsFromURL();
    viewer.loadGUI(() => {
      viewer.setLanguage("en");
      viewer.toggleSidebar();
    });

    const state = {
      shots: [],
      routeLine: null,
      markers: [],
      pointcloud: null,
      selectedIndex: -1,
      sharedMarkerGeometry: new THREE.SphereGeometry(0.22, 12, 12)
    };

    async function loadShots() {
      const response = await fetch("./panorama_positions.json");
      if (!response.ok) {
        throw new Error(`Cannot load panorama_positions.json (${response.status})`);
      }
      state.shots = await response.json();
    }

    function makeMarkerMaterial(selected) {
      return new THREE.MeshBasicMaterial({
        color: selected ? 0xd96d3f : 0x0f6c66,
        transparent: true,
        opacity: 0.95
      });
    }

    function updateMarkerSelection() {
      state.markers.forEach((marker) => {
        const isSelected = marker.userData.shotIndex === state.selectedIndex;
        marker.material.color.setHex(isSelected ? 0xd96d3f : 0x0f6c66);
        marker.scale.setScalar(isSelected ? 1.5 : 1);
      });
    }

    function focusShot(index, moveCamera = true) {
      if (index < 0 || index >= state.shots.length) {
        return;
      }
      state.selectedIndex = index;
      updateMarkerSelection();
      if (!moveCamera) {
        return;
      }
      const shot = state.shots[index];
      const eye = [shot.x + 4, shot.y - 4, shot.z + 3];
      const target = [shot.x, shot.y, shot.z];
      viewer.scene.view.setView(eye, target);
    }

    function postSelection(index) {
      window.parent.postMessage(
        {
          type: "potree-shot-selected",
          index,
          shot: state.shots[index]
        },
        "*"
      );
    }

    function addRoute() {
      const positions = [];
      for (const shot of state.shots) {
        positions.push(shot.x, shot.y, shot.z);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      const material = new THREE.LineBasicMaterial({ color: 0xb4a89a });
      state.routeLine = new THREE.Line(geometry, material);
      viewer.scene.scene.add(state.routeLine);
    }

    function addMarkers() {
      state.markers = state.shots.map((shot, index) => {
        const marker = new THREE.Mesh(state.sharedMarkerGeometry, makeMarkerMaterial(false));
        marker.position.set(shot.x, shot.y, shot.z);
        marker.userData.shotIndex = index;
        viewer.scene.scene.add(marker);
        return marker;
      });
    }

    function setupPicking() {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      viewer.renderer.domElement.addEventListener("click", (event) => {
        const rect = viewer.renderer.domElement.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

        const camera = viewer.scene.getActiveCamera();
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(state.markers, false);
        if (hits.length === 0) {
          return;
        }

        const index = hits[0].object.userData.shotIndex;
        state.selectedIndex = index;
        updateMarkerSelection();
        postSelection(index);
      });
    }

    function handleMessages() {
      window.addEventListener("message", (event) => {
        const message = event.data;
        if (!message || typeof message !== "object") {
          return;
        }
        if (message.type === "select-shot" && Number.isInteger(message.index)) {
          focusShot(message.index, Boolean(message.moveCamera));
        }
      });
    }

    async function init() {
      await loadShots();

      Potree.loadPointCloud("./potree_scene/pointcloud_v17/cloud.js", "MLS", (e) => {
        state.pointcloud = e.pointcloud;
        viewer.scene.addPointCloud(state.pointcloud);

        const material = state.pointcloud.material;
        material.activeAttributeName = "rgba";
        material.size = 1;
        material.minSize = 1;
        material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
        material.shape = Potree.PointShape.SQUARE;

        addRoute();
        addMarkers();
        setupPicking();
        handleMessages();

        viewer.fitToScreen();
        focusShot(0, false);
      });
    }

    init().catch((error) => {
      const errorBanner = document.getElementById("errorBanner");
      errorBanner.textContent = `Potree init error: ${error.message}`;
      errorBanner.style.display = "block";
      console.error(error);
    });
  </script>
</body>
</html>
